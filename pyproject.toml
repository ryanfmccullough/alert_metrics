[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alert_metrics"
version = "0.1.0"
description = "Event-level evaluation of continuous early-warning scores: alarm burden, warning time, refractory suppression, calibration, and operating points"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ryan F. McCullough", email = "ryan@ryanfmccullough.com" }]
keywords = ["early warning", "alarm burden", "warning time", "calibration", "operating point", "clinical decision support"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4", "hypothesis>=6.0"]

[project.urls]
Homepage = "https://github.com/ryanfmccullough/alert_metrics"
Issues = "https://github.com/ryanfmccullough/alert_metrics/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
